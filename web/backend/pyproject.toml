[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orrery-backend"
version = "0.1.0"
description = "Orrery web backend — auth, projects, agent routing, approvals."
requires-python = ">=3.12"
dependencies = [
    "orrery-lib",                 # the shared agent response schema (light)
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "argon2-cffi>=23,<25",
    "itsdangerous>=2.1,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "httpx>=0.27,<1.0",
    "email-validator>=2,<3",
    "python-multipart>=0.0.9,<1.0",  # FastAPI file/form uploads
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.uv.sources]
orrery-lib = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/orrery_backend"]

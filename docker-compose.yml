# Orrery local dev stack: gateway + qdrant + engineering agent (HTTP) +
# backend + postgres. The CLI agent shares the engineering image.

name: orrery

# ── Shared config for the engineering agent image (HTTP service + CLI) ──
x-engineering-build: &engineering-build
  build:
    context: ./agents
    dockerfile: engineering/Dockerfile

# Run containers as the host user (dev) so files they create in the bind
# mounts are owned by jronk, not root. The orrery system user is a Droplet
# concern (deferred). Override at deploy time.
x-run-as-host-user: &run-as-host-user "1000:1000"

x-engineering-env: &engineering-env
  ORRERY_GATEWAY_URL: "http://gateway:4000/v1"
  ORRERY_MODEL: "claude-sonnet"
  ORRERY_QDRANT_URL: "http://qdrant:6333"
  ORRERY_EMBED_MODEL: "BAAI/bge-small-en-v1.5"
  ORRERY_GOOGLE_SA_JSON: "/app/secrets/service-account.json"
  ORRERY_ENG_DRIVE_FOLDER_ID: "${ORRERY_ENG_DRIVE_FOLDER_ID:-}"
  ORRERY_ENG_DRAFTS_FOLDER_ID: "${ORRERY_ENG_DRAFTS_FOLDER_ID:-}"
  # The document store (filesystem). Single source of truth for paths.
  ORRERY_FILES_ROOT: "/var/lib/orrery/files"

x-engineering-volumes: &engineering-volumes
  - ./agents/engineering/src:/app/engineering/src:ro
  - ./config:/app/config:ro
  - ./docs:/app/docs:ro
  - ./service-account.json:/app/secrets/service-account.json:ro
  # The document store, read-write (the agent reads + writes here).
  - /var/lib/orrery/files:/var/lib/orrery/files:rw
  - ./logs:/app/logs

services:
  gateway:
    # LiteLLM is a small Python/FastAPI proxy that speaks the OpenAI
    # chat-completions shape and forwards to whichever provider you
    # config. We use it so:
    #   1. The Anthropic key is in ONE place (this container only).
    #   2. The agent code talks OpenAI-shape and we can swap providers
    #      later without touching it.
    #   3. We get rate-limit handling, retries, and observability for
    #      free.
    # `main-stable` is LiteLLM's "moving but tested" tag. Pin to a
    # specific sha later when stability matters more than freshness.
    image: ghcr.io/berriai/litellm:main-stable
    container_name: orrery-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      # Mount the model-routing config read-only.
      - ./gateway/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    healthcheck:
      # LiteLLM's image doesn't ship curl, so use Python (which is in
      # the image regardless) to hit the liveliness endpoint.
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3).read(); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────
  # Qdrant — the knowledge-base vector DB. Two collections:
  #   - docs:      curated, indexed from docs/ via `make index-docs`
  #   - learnings: provisional, written by the agent's add_kb tool
  # Data persists in a named volume so collections survive restarts.
  # ─────────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: orrery-qdrant
    restart: unless-stopped
    ports:
      # REST + gRPC dashboard at http://localhost:6333/dashboard
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # Qdrant's image ships bash but no curl/wget/python. Use bash's
      # built-in /dev/tcp redirection to hit /healthz over HTTP and
      # grep for a 200 response.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────
  # Engineering agent as an HTTP service. The backend calls it at
  # http://engineering:8001/run. Stateless — conversation state lives in
  # the backend.
  # ─────────────────────────────────────────────────────────────────────
  engineering:
    <<: *engineering-build
    image: orrery-engineering:latest
    container_name: orrery-engineering
    user: *run-as-host-user
    env_file:
      - .env
    environment: *engineering-env
    volumes: *engineering-volumes
    # Override the image's CLI entrypoint to run the HTTP server.
    entrypoint: ["uvicorn"]
    command:
      - "orrery_engineering.server:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8001"
      - "--reload"
      - "--reload-dir"
      - "/app/engineering/src"
    ports:
      - "8001:8001"  # exposed for debugging; the backend uses the in-network name
    depends_on:
      gateway:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8001/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────
  # The same image as a CLI. Not started by `compose up` (profile: cli);
  # run via `make chat` / `make ask Q="..."`.
  # ─────────────────────────────────────────────────────────────────────
  agent:
    <<: *engineering-build
    image: orrery-engineering:latest
    container_name: orrery-agent-cli
    user: *run-as-host-user
    env_file:
      - .env
    environment: *engineering-env
    volumes: *engineering-volumes
    entrypoint: ["python", "-m", "orrery_engineering"]
    depends_on:
      gateway:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    profiles:
      - cli

  # ─────────────────────────────────────────────────────────────────────
  # Postgres — backend's database (users, sessions, and later projects,
  # proposals, etc.). Dev credentials; override in prod.
  # ─────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: orrery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orrery
      POSTGRES_PASSWORD: orrery
      POSTGRES_DB: orrery
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orrery -d orrery"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────
  # Web backend (FastAPI). Mediates everything: auth, agent routing.
  # Runs alembic migrations on start, then uvicorn.
  # ─────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    container_name: orrery-backend
    restart: unless-stopped
    user: *run-as-host-user
    env_file:
      - .env
    environment:
      ORRERY_DATABASE_URL: "postgresql+psycopg://orrery:orrery@postgres:5432/orrery"
      ORRERY_ENGINEERING_AGENT_URL: "http://engineering:8001"
      ORRERY_SESSION_SECRET: "${ORRERY_SESSION_SECRET:-dev-insecure-change-me}"
      ORRERY_FILES_ROOT: "/var/lib/orrery/files"
      ORRERY_ENV: "dev"
      HOME: "/tmp"
    ports:
      - "8000:8000"
    volumes:
      - ./web/backend/src:/app/backend/src
      - ./web/backend/alembic:/app/backend/alembic
      - /var/lib/orrery/files:/var/lib/orrery/files:rw
    depends_on:
      postgres:
        condition: service_healthy
      engineering:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  qdrant-data:
  postgres-data:

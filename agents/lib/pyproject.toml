[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orrery-lib"
version = "0.1.0"
description = "Shared utilities for Orrery agents — gateway client, KB wrapper, Drive helpers."
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=0.4,<1.0",
    "qdrant-client~=1.12.0",
    "fastembed>=0.4,<1.0",
    "google-api-python-client>=2.0,<3.0",
    "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/orrery_lib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orrery-lib"
version = "0.1.0"
description = "Shared utilities for Orrery agents — schema, gateway client, KB wrapper, Drive helpers."
requires-python = ">=3.12"
# Core deps are light: just what the shared schema/errors need, so the
# web backend can import orrery_lib.schema without the agent's heavy deps.
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
# The agent-side modules (gateway, kb, drive) and their heavy deps. Agents
# install `orrery-lib[agent]`; the backend installs plain `orrery-lib`.
agent = [
    "pydantic-ai>=0.4,<1.0",
    "qdrant-client~=1.12.0",
    "fastembed>=0.4,<1.0",
    "google-api-python-client>=2.0,<3.0",
    "python-docx>=1.1,<2.0",
    "odfpy>=1.4,<2.0",
    "httpx>=0.27,<1.0",
]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/orrery_lib"]

# Orrery — host nginx server block. Replace <your-domain> below before installing.
#
# Install:
#   sudo cp infra/nginx/orrery.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/orrery.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <your-domain>
# certbot rewrites this to add the `listen 443 ssl` server + the 80->443 redirect.
# (additive — nginx routes by server_name, so the other app on the box is unaffected.)

server {
    listen 80;
    listen [::]:80;
    server_name <your-domain>;

    # The built SPA, published by the frontend-builder into this dir.
    root /srv/orrery/frontend;
    index index.html;

    # Uploads are capped at 25 MB by the backend; nginx defaults to 1 MB.
    client_max_body_size 30m;

    # API + OpenAPI -> the backend (compose publishes it on 127.0.0.1:8000).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # agent runs can take up to ~5 min
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
